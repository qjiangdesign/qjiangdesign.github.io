<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420"><rect width="1280" height="420" fill="#f4f3f7"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="70" fill="#26232c" font-size="32">从照片到自己的座舱</text><rect x="48" y="118" width="384" height="246" rx="8" fill="white"/><text x="76" y="164" fill="#8c819f" font-size="18">01</text><text x="76" y="229" fill="#26232c" font-size="26">选择风格 → 上传照片</text><text x="76" y="281" fill="#68636e" font-size="21">用视觉选择开启创作</text><rect x="448" y="118" width="384" height="246" rx="8" fill="white"/><text x="476" y="164" fill="#8c819f" font-size="18">02</text><text x="476" y="229" fill="#26232c" font-size="26">AI 生成 → 自由装扮</text><text x="476" y="281" fill="#68636e" font-size="21">相框 · 背景 · 贴纸</text><rect x="848" y="118" width="384" height="246" rx="8" fill="white"/><text x="876" y="164" fill="#8c819f" font-size="18">03</text><text x="876" y="229" fill="#26232c" font-size="26">保存与应用</text><text x="876" y="281" fill="#68636e" font-size="21">让作品成为日常桌面</text></g></svg>